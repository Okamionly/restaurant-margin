name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Le depot porte DEUX schemas Prisma qui doivent rester identiques :
  # prisma/schema.prisma (dont derive le client des serverless api/ et api-lib/)
  # et server/prisma/schema.prisma (que `build:vercel` regenere).
  # Constate le 2026-09-18 : ils avaient diverge sur `signupSource` sans que rien
  # ne casse ni n'alerte. Ce job est rapide et sans installation : il echoue vite,
  # avant les jobs lourds.
  schemas-prisma:
    name: Schemas Prisma identiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparer les deux schemas
        run: node scripts/verifier-schemas-prisma.cjs

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: TypeScript check
        run: cd client && npx tsc --noEmit --skipLibCheck

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Build
        run: cd client && npx vite build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 et non 20 : ce job est le seul a installer le package-lock.json
      # de la RACINE, et ce lock est genere en developpement avec Node 24 / npm 11.
      # npm 10 (Node 20) resolvait `@emnapi/core@1.11.3` la ou npm 11 ecrit 1.10.0
      # dans le lock — ces paquets WASM viennent de @rolldown/binding-wasm32-wasi,
      # tire par vitest 4. `npm ci` refusait donc de s'installer, et la suite de
      # tests unitaires avec son seuil de couverture de 70 % ne tournait plus DU
      # TOUT depuis des mois, sans que personne ne le voie : le CI etait rouge en
      # permanence, donc plus personne ne le lisait.
      # Regenerer le lock ne suffisait pas : il faut que le CI et l'environnement
      # qui produit le lock parlent la meme version de npm.
      # Vercel n'utilise pas ce lock (build:vercel installe cote client/ et
      # server/), ce changement ne touche donc pas la production.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm install` et non `npm ci`, a contrecoeur et pour une raison mesuree.
      # `npm ci` retabli le 2026-09-24. Il avait du ceder la place a `npm install`
      # parce que package-lock.json, genere en developpement sous WINDOWS,
      # n'enregistre pas les variantes LINUX des dependances optionnelles
      # (@emnapi/core, @emnapi/runtime — paquets WASM tires par vitest 4 via
      # rolldown) : npm ci les reclamait, echouait, et la suite de tests avec son
      # seuil de couverture de 70 % ne tournait donc plus du tout depuis des mois,
      # sans que personne ne le voie, le CI etant rouge en permanence.
      # Ni la regeneration du lock sous Windows ni l'alignement sur Node 24 n'y
      # changeaient quoi que ce soit : il fallait produire le lock SOUS Linux.
      # C'est ce que fait desormais .github/workflows/lock-linux.yml, dans cet
      # environnement exact — npm ci l'accepte, et l'installation redevient
      # reproductible. Relancer ce workflow apres toute modification des
      # dependances de la racine.
      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage gate (≥70%)
        run: npm run test:coverage
        env:
          JWT_SECRET: test-secret-minimum-32-chars-for-ci-only-xxxxx
          NODE_ENV: test

  e2e:
    name: Playwright E2E (smoke)
    runs-on: ubuntu-latest
    # Non-blocking for now: smoke tests run against prod, can flake on cold start.
    # Promote to required once we have a preview-deployment URL.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install Playwright browsers (chromium only)
        run: cd client && npx playwright install --with-deps chromium

      - name: Run smoke E2E tests
        run: cd client && npm run test:e2e:smoke
        env:
          E2E_BASE_URL: https://www.restaumargin.fr
          E2E_DEMO_EMAIL: ${{ secrets.E2E_DEMO_EMAIL }}
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .env not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git!"
            exit 1
          fi
          if git ls-files --error-unmatch client/.env 2>/dev/null; then
            echo "::error::client/.env file is tracked by git!"
            exit 1
          fi
          if git ls-files --error-unmatch server/.env 2>/dev/null; then
            echo "::error::server/.env file is tracked by git!"
            exit 1
          fi
          echo "No .env files committed."

      - name: Scan for hardcoded secrets
        run: |
          # Fail-the-build patterns (known real-service key prefixes)
          CRITICAL_PATTERNS=(
            'sk-[a-zA-Z0-9_-]{20,}'
            're_[a-zA-Z0-9_-]{20,}'
            'sk_live_[a-zA-Z0-9]{20,}'
            'whsec_[a-zA-Z0-9]{20,}'
            'eyJhbGciOi[a-zA-Z0-9_-]{50,}'
            'xox[baprs]-[a-zA-Z0-9-]{10,}'
          )
          # Warn-only patterns (heuristics prone to false positives)
          WARN_PATTERNS=(
            'SUPABASE_SERVICE_ROLE_KEY\s*=\s*"[^"]{20,}"'
            'password\s*[:=]\s*"[^"]{8,}"'
            'secret\s*[:=]\s*"[^"]{8,}"'
            'api[_-]?key\s*[:=]\s*"[^"]{20,}"'
          )
          CRITICAL_FOUND=0
          for pattern in "${CRITICAL_PATTERNS[@]}"; do
            RESULTS=$(grep -rnE --include="*.ts" --include="*.tsx" --include="*.js" --include="*.mjs" --include="*.cjs" --include="*.json" \
              "$pattern" \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              --exclude-dir=.git \
              --exclude="package-lock.json" \
              . || true)
            if [ -n "$RESULTS" ]; then
              echo "::error::Hardcoded live secret detected matching pattern: $pattern"
              echo "$RESULTS"
              CRITICAL_FOUND=1
            fi
          done
          for pattern in "${WARN_PATTERNS[@]}"; do
            RESULTS=$(grep -rnE --include="*.ts" --include="*.tsx" --include="*.js" --include="*.mjs" --include="*.cjs" --include="*.json" \
              "$pattern" \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              --exclude-dir=.git \
              --exclude="package-lock.json" \
              . || true)
            if [ -n "$RESULTS" ]; then
              echo "::warning::Potential secret matching pattern: $pattern"
              echo "$RESULTS"
            fi
          done
          if [ "$CRITICAL_FOUND" -eq 1 ]; then
            echo "::error::One or more hardcoded live secrets found. Rotate and refactor before merge."
            exit 1
          fi
          echo "No critical hardcoded secrets detected."
