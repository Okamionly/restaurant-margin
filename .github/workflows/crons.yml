# ══════════════════════════════════════════════════════════════════════════
# Planificateur des taches automatiques RestauMargin
#
# POURQUOI CE FICHIER EXISTE
# Ces taches tournaient comme "routines" dans l'app Claude. Probleme constate
# le 2026-09-18 : elles consomment le quota Claude de l'utilisateur et, une fois
# ce quota epuise, elles echouent TOUTES en silence
# ("You've hit your weekly limit") — 2 jours sans digest et sans import des
# emails entrants, sans que personne ne soit prevenu.
#
# Or ces taches ne font qu'appeler un endpoint HTTP : tout le travail reel
# (recherche, IA, base de donnees, envoi d'emails) est fait par le serveur
# Vercel. Elles n'ont donc AUCUN besoin d'un LLM. Les faire dependre d'un quota
# de LLM etait une fragilite gratuite.
#
# GitHub Actions est ici le bon support : gratuit sur depot public, independant
# de l'app Claude et de la machine de l'utilisateur, et il envoie un email
# automatiquement si un job echoue — ce qui redonne une alerte fiable.
#
# ⚠️ Les horaires cron de GitHub Actions sont en UTC et ne suivent PAS l'heure
# d'ete. Les commentaires donnent l'heure de Paris en ete (UTC+2) puis en hiver.
# ══════════════════════════════════════════════════════════════════════════

name: Taches automatiques RestauMargin

on:
  schedule:
    - cron: '15 */2 * * *'   # Import des emails — toutes les 2 h
    - cron: '5 5 * * *'      # Digest du jour — 07h05 Paris (ete) / 06h05 (hiver)
    - cron: '0 7 * * *'      # Emails d'onboarding + fin d'essai — 09h Paris (ete) / 08h (hiver)
    - cron: '0 4 * * 1'      # Recettes de la semaine — lundi 06h Paris (ete)
    - cron: '30 */6 * * *'   # Controle de sante — toutes les 6 h
  workflow_dispatch:
    inputs:
      tache:
        description: "Tache a lancer manuellement"
        required: true
        default: inbox-sync
        type: choice
        options: [inbox-sync, daily-digest, onboarding-nurture, trial-expiry, editorial-weekly, sante, toutes]

concurrency:
  group: crons-restaumargin
  cancel-in-progress: false

jobs:
  taches:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verifier que le secret est configure
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET absent des secrets du depot — les endpoints repondront 401."
            exit 1
          fi

      # Fonction commune : appelle un endpoint, affiche la reponse, echoue si HTTP != 200.
      # L'echec fait rougir le job -> GitHub envoie un email : c'est l'alerte.
      - name: Preparer l'appelant
        run: |
          cat > "$RUNNER_TEMP/appeler.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          nom="$1"; chemin="$2"
          echo "──────────────────────────────────────────"
          echo "▶ $nom"
          corps=$(mktemp)
          # PAS de `curl --retry` : il rejoue sur tout 5xx. Or une tache qui repond
          # 500/502 a pu envoyer une partie de ses emails avant d'echouer (ex. fin
          # d'essai : 4 envois reussis, 1 refuse -> 502) ; la rejouer renverrait
          # les 4 premiers. On ne retente QUE si le serveur n'a pas repondu du tout
          # (code 000 : DNS, TCP, TLS). --max-time (310 s) depasse le maxDuration
          # de la fonction (300 s) : une tache longue repond (ou Vercel renvoie
          # 504) avant que curl n'abandonne, donc 000 ne masque jamais une tache
          # encore en cours.
          code=000
          for essai in 1 2 3; do
            code=$(curl -s -o "$corps" -w '%{http_code}' \
              "https://www.restaumargin.fr$chemin" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 310) || true
            [ "$code" != "000" ] && break
            echo "(pas de reponse du serveur, essai $essai/3)"
            sleep 15
          done
          echo "HTTP $code"
          # Le depot est PUBLIC, donc ces journaux aussi. On n'y imprime JAMAIS le
          # corps brut de la reponse : il contenait les adresses email des prospects
          # importes (constat d'audit du 2026-09-25). On ne garde que les compteurs
          # et indicateurs de premier niveau (nombres, booleens) et un message
          # d'erreur eventuel, tronque — de quoi diagnostiquer, rien de personnel.
          jq -c '(with_entries(select(.value|type=="number" or type=="boolean")))
                 + (if .error then {error: (.error|tostring|gsub("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+";"[email]")|.[0:160])} else {} end)' "$corps" 2>/dev/null \
            || echo "(reponse non JSON, $(wc -c < "$corps") octets — corps non affiche)"
          if [ "$code" != "200" ]; then
            echo "::error::$nom a echoue (HTTP $code)"
            exit 1
          fi
          echo "✓ $nom OK"
          SCRIPT
          chmod +x "$RUNNER_TEMP/appeler.sh"

      - name: Import des emails (messagerie + notifications)
        if: ${{ !cancelled() && (github.event.schedule == '15 */2 * * *' || inputs.tache == 'inbox-sync' || inputs.tache == 'toutes') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: "$RUNNER_TEMP/appeler.sh 'Import des emails' '/api/cron/inbox-sync'"

      - name: Digest du jour
        if: ${{ !cancelled() && (github.event.schedule == '5 5 * * *' || inputs.tache == 'daily-digest' || inputs.tache == 'toutes') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: "$RUNNER_TEMP/appeler.sh 'Digest du jour' '/api/cron/daily-digest'"

      - name: Emails d'onboarding
        if: ${{ !cancelled() && (github.event.schedule == '0 7 * * *' || inputs.tache == 'onboarding-nurture' || inputs.tache == 'toutes') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: "$RUNNER_TEMP/appeler.sh 'Emails onboarding' '/api/cron/onboarding-nurture'"

      # Emails de fin d'essai (J-2, dernier jour, expire). Ajoute le 2026-09-25 :
      # cette tache n'etait declenchee par RIEN de fonctionnel. La routine cloud
      # « trial-rescue » l'appelait en POST sans secret -> refus CSRF, et rapportait
      # « success » quand meme ; elle etait absente de ce fichier.
      - name: Emails de fin d'essai
        if: ${{ !cancelled() && (github.event.schedule == '0 7 * * *' || inputs.tache == 'trial-expiry' || inputs.tache == 'toutes') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: "$RUNNER_TEMP/appeler.sh 'Emails fin d essai' '/api/cron/trial-expiry'"

      - name: Recettes de la semaine
        if: ${{ !cancelled() && (github.event.schedule == '0 4 * * 1' || inputs.tache == 'editorial-weekly' || inputs.tache == 'toutes') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: "$RUNNER_TEMP/appeler.sh 'Recettes de la semaine' '/api/cron/editorial-weekly'"

      # Sante : endpoint PUBLIC (pas de secret). On verifie le contenu, pas juste
      # le code HTTP — la sonde a deja renvoye 200 en annoncant une base en panne.
      - name: Controle de sante
        if: ${{ !cancelled() && (github.event.schedule == '30 */6 * * *' || inputs.tache == 'sante' || inputs.tache == 'toutes') }}
        run: |
          echo "▶ Controle de sante"
          corps=$(curl -s "https://www.restaumargin.fr/api/health?deep=1" --max-time 60 --retry 2)
          # Seulement l'etat des services, pas le corps complet (journaux publics).
          echo "$corps" | jq -c '{status, services}' 2>/dev/null || echo "(reponse non JSON)"
          echo "$corps" | grep -q '"database":"ok"' || { echo "::error::base de donnees KO"; exit 1; }
          echo "$corps" | grep -q '"ai":"ok"'       || { echo "::error::service IA KO"; exit 1; }
          echo "✓ site, base et IA operationnels"
